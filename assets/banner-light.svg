<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .spin { transform-origin: 1000px 160px; animation: spin 90s linear infinite; }
  .node { fill: #6366f1; animation: pulse 3.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .traj { fill: none; stroke: url(#acc); stroke-width: 2.6; stroke-linecap: round;
           stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 4.8s ease-in-out infinite; }
  .fade { opacity: 0; animation: fadein 1.2s ease-out forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } }
  @keyframes draw { 0% { stroke-dashoffset: 1; opacity: 0; } 10% { opacity: 1; }
                     45% { stroke-dashoffset: 0; } 75% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .spin, .node, .traj, .fade { animation: none; opacity: 1; } .traj { stroke-dashoffset: 0; } }
</style>
